codec: |
  function Decode(fPort, data, variables) {
    var values = [];
    if (fPort !== 10 || !Array.isArray(data) || data.length !== 7 || data[0] !== 1) {
      return values;
    }

    var temperatureRaw = (data[1] << 8) | data[2];
    if ((temperatureRaw & 0x8000) !== 0) {
      temperatureRaw -= 0x10000;
    }
    var humidityRaw = (data[3] << 8) | data[4];
    var alarmFlags = data[6];

    values.push({ name: "Temperature", channel: 1, value: temperatureRaw / 10, unit: "degreesCelsius" });
    values.push({ name: "Humidity", channel: 2, value: humidityRaw / 10, unit: "percent" });
    values.push({ name: "Battery Level", channel: 3, value: data[5], unit: "percent" });
    values.push({ name: "High Temperature Alarm", channel: 4, value: alarmFlags & 0x01, unit: null });
    values.push({ name: "Low Battery Alarm", channel: 5, value: (alarmFlags >> 1) & 0x01, unit: null });
    return values;
  }

  function decodeUplink(input) {
    if (!input || !Array.isArray(input.bytes)) {
      return { data: [], errors: ["invalid input"] };
    }
    if (input.fPort !== 10) {
      return { data: [], errors: ["unsupported fPort"] };
    }
    if (input.bytes.length !== 7) {
      return { data: [], errors: ["invalid payload length"] };
    }
    if (input.bytes[0] !== 1) {
      return { data: [], errors: ["unsupported protocol version"] };
    }
    return { data: Decode(input.fPort, input.bytes, input.variables) };
  }
