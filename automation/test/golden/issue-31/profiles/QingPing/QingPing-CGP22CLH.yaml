codec: |
  function Decode(fPort, data, variables) {
    var values = [];
    if (!Array.isArray(data) || data.length < 4) return values;
    if (data[0] !== 0x01 || data[1] !== 0x41) return values;

    if (data[3] === 0x01) {
      if (data.length !== 21) return values;
      var packed = ((data[8] & 0xff) << 16) | ((data[9] & 0xff) << 8) | (data[10] & 0xff);
      values.push({ name: "Temperature", channel: 1, value: ((packed >>> 12) - 500) / 10, unit: "degreesCelsius" });
      values.push({ name: "Humidity", channel: 2, value: (packed & 0xfff) / 10, unit: "percentRelativeHumidity" });
      values.push({ name: "CO2 Value", channel: 3, value: ((data[11] & 0xff) << 8) | (data[12] & 0xff), unit: "partsPerMillion" });
      values.push({ name: "Battery", channel: 4, value: data[13] & 0xff, unit: "percent" });
      return values;
    }

    if (data[3] === 0x00) {
      if (data.length !== 42) return values;
      var offset = 10;
      var boundary = data.length - 2;
      var lastPacked = null;
      var lastCO2 = null;
      var lastBattery = null;
      while (offset + 6 <= boundary) {
        lastPacked = ((data[offset] & 0xff) << 16) | ((data[offset + 1] & 0xff) << 8) | (data[offset + 2] & 0xff);
        lastCO2 = ((data[offset + 3] & 0xff) << 8) | (data[offset + 4] & 0xff);
        lastBattery = data[offset + 5] & 0xff;
        offset += 6;
      }
      if (offset !== boundary || lastPacked === null) return [];
      values.push({ name: "Temperature", channel: 1, value: ((lastPacked >>> 12) - 500) / 10, unit: "degreesCelsius" });
      values.push({ name: "Humidity", channel: 2, value: (lastPacked & 0xfff) / 10, unit: "percentRelativeHumidity" });
      values.push({ name: "CO2 Value", channel: 3, value: lastCO2, unit: "partsPerMillion" });
      values.push({ name: "Battery", channel: 4, value: lastBattery, unit: "percent" });
      return values;
    }
    return values;
  }

  function decodeUplink(input) {
    try {
      if (!input || !Array.isArray(input.bytes)) return { data: [], errors: ["invalid input"] };
      var data = Decode(input.fPort, input.bytes, input.variables);
      if (data.length === 0) return { data: [], errors: ["invalid or unsupported frame"] };
      return { data: data };
    } catch (error) {
      return { data: [], errors: ["invalid frame"] };
    }
  }
