name: Profile Automation - Intake

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: profile-intake-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  intake:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      status: ${{ steps.intake.outputs.status }}
      issue_number: ${{ steps.intake.outputs.issue_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Profile Automation dependencies
        run: npm ci --prefix automation --omit=dev --ignore-scripts

      - name: Check request completeness
        id: intake
        run: node automation/src/cli.js intake --event "$GITHUB_EVENT_PATH" --output automation/.work/intake.json

      - name: Update Issue status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node automation/src/cli.js apply-intake --intake automation/.work/intake.json

  build:
    needs: intake
    if: needs.intake.outputs.status == 'ready'
    uses: ./.github/workflows/profile-build.yml
    with:
      issue_number: ${{ fromJSON(needs.intake.outputs.issue_number) }}
      feedback: ''
    secrets: inherit
