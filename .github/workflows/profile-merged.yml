name: Profile Automation - Merge Completion
run-name: Profile ${{ github.event.pull_request.head.ref }} merge completion

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  complete:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'auto-profile-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --prefix automation --omit=dev --ignore-scripts
      - name: Mark the merged Profile unverified and close the request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node automation/src/cli.js merged --event "$GITHUB_EVENT_PATH"
