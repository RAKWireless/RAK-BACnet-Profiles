name: Profile Automation - Shadow Evaluation
run-name: Profile shadow evaluation (${{ inputs.provider }})

on:
  workflow_dispatch:
    inputs:
      issue_numbers:
        description: JSON array; one Issue for smoke testing, at least 10 eligible Issues for rollout evaluation
        required: true
        default: '[31]'
      enforce_rollout_gate:
        description: Require at least 10 eligible Issues in addition to the 85% success target
        required: true
        type: boolean
        default: false
      provider:
        description: Provider Environment
        required: true
        type: choice
        default: openai
        options: [deepseek, openai]
      model:
        description: Optional model override
        required: false
        type: string
      effort:
        description: Optional reasoning-effort override; otherwise use the Environment value
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  shadow:
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        issue_number: ${{ fromJSON(inputs.issue_numbers) }}
    uses: ./.github/workflows/profile-build.yml
    with:
      issue_number: ${{ matrix.issue_number }}
      issue_body_sha: current
      provider: ${{ inputs.provider }}
      model: ${{ inputs.model }}
      effort: ${{ inputs.effort }}
      mode: shadow
      allow_existing: true
    secrets: inherit

  summary:
    needs: shadow
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: shadow-*
          path: automation/.work/shadow-results
      - name: Evaluate rollout gates
        env:
          ENFORCE_ROLLOUT_GATE: ${{ inputs.enforce_rollout_gate }}
          EXPECTED_ISSUE_NUMBERS: ${{ inputs.issue_numbers }}
        run: >-
          node scripts/evaluate-shadow-run.js automation/.work/shadow-results
          --expected-issues "$EXPECTED_ISSUE_NUMBERS"
          --enforce-rollout-gate "$ENFORCE_ROLLOUT_GATE"
