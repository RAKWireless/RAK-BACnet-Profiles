name: Profile Automation - Review Repair
run-name: Profile ${{ github.event.pull_request.head.ref }} review repair

on:
  pull_request_review:
    types: [submitted]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: profile-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.authorization.outputs.authorized }}
      issue_number: ${{ steps.authorization.outputs.issue_number }}
      issue_body_sha: ${{ steps.authorization.outputs.issue_body_sha }}
      feedback: ${{ steps.authorization.outputs.feedback }}
      review_cycle: ${{ steps.authorization.outputs.review_cycle }}
      provider: ${{ steps.authorization.outputs.provider }}
      model: ${{ steps.authorization.outputs.model }}
      effort: ${{ steps.authorization.outputs.effort }}
      reason: ${{ steps.authorization.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --prefix automation --omit=dev --ignore-scripts
      - name: Authorize non-empty Request changes feedback and current Issue SHA
        id: authorization
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROFILE_APPROVERS: ${{ vars.PROFILE_APPROVERS }}
          PROFILE_AGENT_ENABLED: ${{ vars.PROFILE_AGENT_ENABLED }}
          PROFILE_AGENT_DEFAULT_PROVIDER: ${{ vars.PROFILE_AGENT_DEFAULT_PROVIDER }}
        run: node automation/src/cli.js authorize-review --event "$GITHUB_EVENT_PATH"
      - name: Cancel older work for this Issue
        if: steps.authorization.outputs.authorized == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node automation/src/cli.js cancel-issue-runs --issue-number "${{ steps.authorization.outputs.issue_number }}"

  rebuild:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    uses: ./.github/workflows/profile-build.yml
    with:
      issue_number: ${{ fromJSON(needs.authorize.outputs.issue_number) }}
      issue_body_sha: ${{ needs.authorize.outputs.issue_body_sha }}
      provider: ${{ needs.authorize.outputs.provider }}
      model: ${{ needs.authorize.outputs.model }}
      effort: ${{ needs.authorize.outputs.effort }}
      mode: review
      feedback: ${{ needs.authorize.outputs.feedback }}
      review_cycle: ${{ fromJSON(needs.authorize.outputs.review_cycle) }}
      previous_ref: ${{ github.event.pull_request.head.ref }}
    secrets: inherit

  manual_required:
    needs: authorize
    if: needs.authorize.outputs.authorized != 'true' && contains(needs.authorize.outputs.reason, 'limited to')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- profile-automation:review-limit -->';
            const body = `${marker}\nAutomatic review repair reached its three-cycle limit. A maintainer can use **Profile Automation - Manual Generate** with the provider and any required runtime overrides.`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker) && comment.user && comment.user.type === 'Bot');
            if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
