codec: |-
  function Decode(fPort, data, variables) {
    var values = [];
    if (fPort !== 12 || !Array.isArray(data) || data.length !== 9 || data[0] !== 0xA1) {
      return values;
    }

    var co2 = (data[1] << 8) | data[2];

    var temperatureRaw = (data[3] << 8) | data[4];
    if ((temperatureRaw & 0x8000) !== 0) {
      temperatureRaw -= 0x10000;
    }

    var humidityRaw = (data[5] << 8) | data[6];
    var batteryLevel = data[7];
    var statusFlags = data[8];

    values.push({ name: "CO2", channel: 1, value: co2, unit: "partsPerMillion" });
    values.push({ name: "Temperature", channel: 2, value: temperatureRaw / 100, unit: "degreesCelsius" });
    values.push({ name: "Humidity", channel: 3, value: humidityRaw / 100, unit: "percent" });
    values.push({ name: "Battery Level", channel: 4, value: batteryLevel, unit: "percent" });
    values.push({ name: "Occupancy", channel: 5, value: (statusFlags & 0x01) ? 1 : 0, unit: null });
    values.push({ name: "Sensor Fault", channel: 6, value: (statusFlags & 0x02) ? 1 : 0, unit: null });
    return values;
  }

  function decodeUplink(input) {
    if (!input || !Array.isArray(input.bytes)) {
      return { data: [], errors: ["invalid input"] };
    }
    if (input.fPort !== 12) {
      return { data: [], errors: ["unsupported fPort"] };
    }
    if (input.bytes.length !== 9) {
      return { data: [], errors: ["invalid payload length"] };
    }
    if (input.bytes[0] !== 0xA1) {
      return { data: [], errors: ["unsupported message type"] };
    }
    return { data: Decode(input.fPort, input.bytes, input.variables) };
  }
