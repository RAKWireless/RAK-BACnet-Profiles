name: S31B-LB
model: Dragino-S31B-LB
vendor: Dragino
profileVersion: 1.0.0
codec: |
  function Decode(fPort, bytes, variables) {
    var values = [];
    if (!bytes || bytes.length < 11 || fPort !== 2) {
      return values;
    }
    var mode = (bytes[6] & 0x7c) >> 2;
    if (mode === 0) {
      var batV = ((bytes[0] << 8) | bytes[1]);
      var tempC = ((bytes[7] << 24 >> 16) | bytes[8]) / 10;
      var hum = ((bytes[9] << 8) | bytes[10]) / 10;
      values.push({ name: "TempC_SHT31", channel: 1, value: tempC, unit: "degreesCelsius" });
      values.push({ name: "Hum_SHT31", channel: 2, value: hum, unit: "percentRelativeHumidity" });
      values.push({ name: "BatV", channel: 3, value: batV, unit: "millivolts" });
    }
    return values;
  }

  function Encode(data, variables) {
    // Not used for uplink-only sensor; stub implementation
  }

  function decodeUplink(input) {
    return {
      data: Decode(input.fPort, input.bytes, input.variables)
    };
  }

  function encodeDownlink(input) {
    return {
      bytes: Encode(input.data, input.variables)
    };
  }
datatype:
  "1":
    covIncrement: 0.1
    name: TempC_SHT31
    type: AnalogInputObject
    units: degreesCelsius
    updateInterval: 60
  "2":
    covIncrement: 0.5
    name: Hum_SHT31
    type: AnalogInputObject
    units: percentRelativeHumidity
    updateInterval: 60
  "3":
    covIncrement: 10
    name: BatV
    type: AnalogInputObject
    units: millivolts
    updateInterval: 3600
lorawan:
  adrAlgorithm: LoRA Only
  classCDownlinkTimeout: 0
  macVersion: LORAWAN_1_0_3
  regionalParametersRevision: A
  supportClassB: false
  supportClassC: false
  supportOTAA: true
