name: SE01-LB
model: Dragino-SE01-LB
vendor: Dragino
profileVersion: 1.0.0
lorawan:
  macVersion: LORAWAN_1_0_3
  supportClassB: false
  supportClassC: false
  adrAlgorithm: LoRa Only
  classCDownlinkTimeout: 0
  regionalParametersRevision: A
  supportOTAA: true
codec: |
  function Decode(fPort, data, variables) {
    var values = [];
    // SoilMoisture → Analog Input (AI) – Units: %
    // SoilTemperature → Analog Input (AI) – Units: °C
    // EC → Analog Input (AI) – Units: µS/cm
    // BatV → Analog Input (AI) – Units: Volts
    if (fPort !== 2) {
      return values;
    }

    if (data.length >= 8) {
      var BatV = (data[0] << 8 | data[1]);
      var SoilMoisture = ((data[2] << 8) | data[3]) / 100;
      var SoilTemperature = ((data[4] << 24 >> 16) | data[5]) / 100;
      var EC = ((data[6] << 8) | data[7]);

      values.push({ name: "SoilMoisture", channel: 1, value: SoilMoisture, unit: "percent" });
      values.push({ name: "SoilTemperature", channel: 2, value: SoilTemperature, unit: "degreesCelsius" });
      values.push({ name: "EC", channel: 3, value: EC, });
      values.push({ name: "BatV", channel: 4, value: BatV , unit: "millivolts" });
    }

    return values;
  }

  function Encode(data, variables) {
    // Not implemented for uplink-only sensor
  }

  function decodeUplink(input) {
    return {
      data: Decode(input.fPort, input.bytes, input.variables)
    };
  }

  function encodeDownlink(input) {
    return {
      bytes: Encode(input.data, input.variables)
    };
  }
datatype:
  "1":
    covIncrement: 0.1
    name: SoilMoisture
    type: AnalogValueObject
    units: percent
    updateInterval: 300
  "2":
    covIncrement: 0.1
    name: SoilTemperature
    type: AnalogValueObject
    units: degreesCelsius
    updateInterval: 300
  "3":
    covIncrement: 1.0
    name: EC
    type: AnalogValueObject
    updateInterval: 300
  "4":
    covIncrement: 0.01
    name: BatV
    type: AnalogValueObject
    units: millivolts
    updateInterval: 3600
